[package]
name = "lab-06"
version = "0.2.1"
authors = ["Filip Plata <fp371335@students.mimuw.edu.pl>", "Mateusz Banaszek <m.banaszek@mimuw.edu.pl", "Mykhailo Shevchenko <mykhailo.shev@gmail.com>"]
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
tokio = { version = "1.22", features = ["full"] }
bytes = "1.12"
uuid = { version = "1.29", features = ["v4", "serde"] }
async-trait = "0.1"
log = "0.4"
async-channel = "2.5"
executor = { path = "../module-system/", package = "module-system" }

[dev-dependencies]
ntest = "0.10"

[[bin]]
name = "lab06"
path = "main.rs"
